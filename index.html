<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d94f2b">
  <meta name="description" content="知味厨房 —— 结构化电子菜谱，AI 生成菜谱图与烹饪演示视频（模拟服务演示）">
  <title>知味厨房 · 智能电子菜谱</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/home"><span class="lg">🍳</span>知味厨房</a>
    <nav class="nav" aria-label="主导航">
      <a class="nav-btn" data-view="home" href="#/home">首页</a>
      <a class="nav-btn" data-view="upload" href="#/upload">上传中心</a>
      <a class="nav-btn" data-view="tasks" href="#/tasks">任务中心</a>
    </nav>
    <div class="qwrap">
      <span class="proto-tag">演示数据 · AI 能力为本地模拟</span>
      <span class="qchip" data-tooltip="每日图片生成配额"><i data-lucide="image" aria-hidden="true"></i>图 <b class="tnum" id="q-img">10</b></span>
      <span class="qchip" data-tooltip="每日视频生成配额"><i data-lucide="clapperboard" aria-hidden="true"></i>视频 <b class="tnum" id="q-vid">1</b></span>
      <span class="qchip" data-tooltip="每日智能解析配额"><i data-lucide="pencil" aria-hidden="true"></i>解析 <b class="tnum" id="q-parse">20</b></span>
      <button class="icbtn" id="btn-reset" data-tooltip="重置演示数据" aria-label="重置演示数据"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
      <span class="avatar" aria-label="我的账户">🏠</span>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" aria-label="底部导航">
    <a class="bn-item" data-view="home" href="#/home"><i data-lucide="home" aria-hidden="true"></i>首页</a>
    <a class="bn-item" data-view="upload" href="#/upload"><i data-lucide="upload" aria-hidden="true"></i>上传</a>
    <a class="bn-item" data-view="tasks" href="#/tasks"><i data-lucide="list" aria-hidden="true"></i>任务</a>
  </nav>

  <div class="overlay" id="modal-parse" role="dialog" aria-modal="true" aria-label="智能解析菜谱文本">
    <div class="modal">
      <h3>智能解析菜谱文本</h3>
      <p class="small muted">粘贴任意格式的菜谱文字，大模型自动抽取菜名、食材与步骤（≤3000 字）。</p>
      <textarea id="parse-text">番茄炒蛋：番茄2个切块，鸡蛋3个打散加少许盐。先热锅下油，把蛋液炒至刚凝固盛出；余油下番茄炒出汁，倒回鸡蛋翻炒均匀，加盐和一点糖调味，撒葱花出锅。全程约15分钟，2人份。小贴士：蛋液加几滴水更嫩。</textarea>
      <div class="mact">
        <button class="sb" id="btn-parse-cancel">取消</button>
        <button class="pb" id="btn-parse-run">开始解析</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toast-root" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/services.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
